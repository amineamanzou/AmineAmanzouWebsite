<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Le SLO précède le dashboard</title><desc id="desc">Une chaîne part du résultat utilisateur vers le SLI, le SLO, le budget d'erreur puis le dashboard.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563eb"/></marker></defs><rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="95" y="118" fill="#121821" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">START WITH THE USER OUTCOME</text><text x="98" y="170" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="26">The dashboard is the exploration surface, not the objective.</text>
