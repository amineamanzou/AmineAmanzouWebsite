<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">2026 in numbers</title>
  <desc id="desc">Six figures from the year: more than 400 posts, 527,000 views and impressions, 22,000 interactions, 3,836 agent sessions since June, 166 days with an agent and 1,402 GitHub contributions.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="26" fill="#111"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#grid)" stroke="#f4efe5" stroke-width="4"/>
  <rect x="72" y="64" width="330" height="48" rx="8" fill="#ffd447"/>
  <text x="96" y="98" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="800">2026 IN NUMBERS</text>
  <text x="72" y="158" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="25">A year of content, six months with agents.</text>
  <rect x="80" y="220" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="80" y="220" width="14" height="210" rx="7" fill="#ffd447"/>
  <text x="128" y="332" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">409+</text>
  <text x="128" y="388" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">posts</text>
  <rect x="580" y="220" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="580" y="220" width="14" height="210" rx="7" fill="#ffd447"/>
  <text x="628" y="332" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">527k</text>
  <text x="628" y="388" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">views and impressions</text>
  <rect x="1080" y="220" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="1080" y="220" width="14" height="210" rx="7" fill="#ffd447"/>
  <text x="1128" y="332" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">22k</text>
  <text x="1128" y="388" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">interactions</text>
  <rect x="80" y="470" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="80" y="470" width="14" height="210" rx="7" fill="#e22b2b"/>
  <text x="128" y="582" fill="#e22b2b" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">3,836</text>
  <text x="128" y="638" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">agent sessions</text>
  <rect x="580" y="470" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="580" y="470" width="14" height="210" rx="7" fill="#e22b2b"/>
  <text x="628" y="582" fill="#e22b2b" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">166</text>
  <text x="628" y="638" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">days with an agent</text>
  <rect x="1080" y="470" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="1080" y="470" width="14" height="210" rx="7" fill="#2faa67"/>
  <text x="1128" y="582" fill="#2faa67" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">1,402</text>
  <text x="1128" y="638" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">GitHub contributions</text>
  <text x="800" y="790" fill="#b9b3a6" font-family="Epilogue, Arial, sans-serif" font-size="21" text-anchor="middle">Content measured in mid-July 2026. Sessions from June 1 to November 26. GitHub for the year, as of November 26.</text>
</svg>
