<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">2026 en chiffres</title>
  <desc id="desc">Six chiffres de l’année : plus de 400 publications, 527 000 vues et impressions, 22 000 interactions, 3 836 sessions avec un agent depuis juin, 166 jours avec un agent et 1 402 contributions GitHub.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="26" fill="#111"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#grid)" stroke="#f4efe5" stroke-width="4"/>
  <rect x="72" y="64" width="330" height="48" rx="8" fill="#ffd447"/>
  <text x="96" y="98" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="800">2026 EN CHIFFRES</text>
  <text x="72" y="158" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="25">Une année de contenu, six mois avec des agents.</text>
  <rect x="80" y="220" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
