  <text x="800" y="790" fill="#b9b3a6" font-family="Epilogue, Arial, sans-serif" font-size="21" text-anchor="middle">Contenu relevé à la mi-juillet 2026. Sessions du 1er juin au 26 novembre. GitHub sur l’année, au 26 novembre.</text>
