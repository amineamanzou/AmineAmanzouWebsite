  <text x="128" y="388" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">publications</text>
  <rect x="580" y="220" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="580" y="220" width="14" height="210" rx="7" fill="#ffd447"/>
  <text x="628" y="332" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">527 k</text>
  <text x="628" y="388" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">vues et impressions</text>
  <rect x="1080" y="220" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="1080" y="220" width="14" height="210" rx="7" fill="#ffd447"/>
  <text x="1128" y="332" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">22 k</text>
  <text x="1128" y="388" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">interactions</text>
  <rect x="80" y="470" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
  <rect x="80" y="470" width="14" height="210" rx="7" fill="#e22b2b"/>
  <text x="128" y="582" fill="#e22b2b" font-family="Space Grotesk, Arial, sans-serif" font-size="78" font-weight="800">3 836</text>
  <text x="128" y="638" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700">sessions avec un agent</text>
  <rect x="580" y="470" width="440" height="210" rx="22" fill="#1b1b1b" stroke="#f4efe5" stroke-width="4"/>
