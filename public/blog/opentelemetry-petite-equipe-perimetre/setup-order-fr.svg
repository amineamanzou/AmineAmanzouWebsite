<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">L’ordre de mise en place d’OpenTelemetry dans une petite équipe</title>
  <desc id="desc">Trois étapes dans l’ordre : les basiques avec les logs et les métriques, puis le tracing avec de l’instrumentation manuelle sur les parcours métier, puis le côté utilisateur. Les dashboards ne viennent pas au début.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="26" fill="#111"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#grid)" stroke="#f4efe5" stroke-width="4"/>
  <rect x="72" y="64" width="380" height="48" rx="8" fill="#ffd447"/>
  <text x="96" y="98" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="800">PAR QUOI COMMENCER</text>
  <text x="72" y="158" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="25">L’ordre que je suis pour mettre en place OpenTelemetry dans une petite équipe.</text>
  <rect x="80" y="270" width="400" height="290" rx="22" fill="#f4efe5"/>
  <rect x="80" y="270" width="400" height="76" rx="22" fill="#2faa67"/>
  <circle cx="130" cy="308" r="26" fill="#111"/>
  <text x="130" y="319" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">1</text>
  <text x="172" y="318" fill="#fff" font-family="Space Grotesk, Arial, sans-serif" font-size="25" font-weight="800">LES BASIQUES</text>
  <text x="280" y="412" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">OpenTelemetry déployé</text>
  <text x="280" y="458" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Santé des collecteurs</text>
  <text x="280" y="504" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Logs et métriques</text>
  <path d="M492 415H558" fill="none" stroke="#ffd447" stroke-width="9" stroke-linecap="round"/>
  <path d="M556 395L590 415L556 435Z" fill="#ffd447"/>
  <rect x="600" y="270" width="400" height="290" rx="22" fill="#f4efe5"/>
  <rect x="600" y="270" width="400" height="76" rx="22" fill="#2f7ef7"/>
  <circle cx="650" cy="308" r="26" fill="#111"/>
  <text x="650" y="319" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">2</text>
  <text x="692" y="318" fill="#fff" font-family="Space Grotesk, Arial, sans-serif" font-size="25" font-weight="800">LE TRACING</text>
  <text x="800" y="412" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Auto-instrumentation</text>
  <text x="800" y="458" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Puis du manuel sur</text>
  <text x="800" y="504" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">les parcours métier</text>
  <path d="M1012 415H1078" fill="none" stroke="#ffd447" stroke-width="9" stroke-linecap="round"/>
  <path d="M1076 395L1110 415L1076 435Z" fill="#ffd447"/>
  <rect x="1120" y="270" width="400" height="290" rx="22" fill="#f4efe5"/>
  <rect x="1120" y="270" width="400" height="76" rx="22" fill="#e22b2b"/>
  <circle cx="1170" cy="308" r="26" fill="#111"/>
  <text x="1170" y="319" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">3</text>
  <text x="1212" y="318" fill="#fff" font-family="Space Grotesk, Arial, sans-serif" font-size="25" font-weight="800">CÔTÉ UTILISATEUR</text>
  <text x="1320" y="412" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">RUM</text>
  <text x="1320" y="458" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Statistiques de visite</text>
  <text x="1320" y="504" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Parcours après un bug</text>
  <rect x="530" y="672" width="540" height="52" rx="8" fill="#ffd447"/>
  <text x="800" y="708" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">PAS AU DÉBUT : LES DASHBOARDS</text>
  <text x="800" y="776" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="24" text-anchor="middle">D’abord des alertes actionnables, un budget maîtrisé et moins de bruit.</text>
</svg>
