<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Une ingestion partagée pour les logs d’accès, deux usages</title>
  <desc id="desc">Les événements d’accès passent par une ingestion partagée, puis servent à l’observabilité pour l’exploitation quotidienne avec un détail réduit, et à la sécurité pour diagnostiquer attaques et détournements avec un détail fin.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="26" fill="#111"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#grid)" stroke="#f4efe5" stroke-width="4"/>
  <rect x="72" y="64" width="500" height="48" rx="8" fill="#ffd447"/>
  <text x="96" y="98" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="800">UNE INGESTION, DEUX USAGES</text>
  <text x="72" y="158" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="25">Les logs d’accès servent l’exploitation et la sécurité, à des niveaux de détail différents.</text>

  <rect x="80" y="310" width="360" height="250" rx="22" fill="#f4efe5"/>
  <rect x="80" y="310" width="360" height="66" rx="22" fill="#111" stroke="#f4efe5" stroke-width="4"/>
  <text x="260" y="353" fill="#fff" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle">ÉVÉNEMENTS D’ACCÈS</text>
  <text x="260" y="428" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Qui se connecte</text>
  <text x="260" y="462" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Sur quelle session</text>
  <text x="260" y="496" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Pour quelle action</text>

  <path d="M452 435H582" fill="none" stroke="#ffd447" stroke-width="9" stroke-linecap="round"/>
  <path d="M580 415L614 435L580 455Z" fill="#ffd447"/>

  <rect x="630" y="340" width="340" height="190" rx="22" fill="#ffd447"/>
  <text x="800" y="392" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle">INGESTION PARTAGÉE</text>
  <text x="800" y="442" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Rien ne se perd</text>
  <text x="800" y="476" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">pendant un incident</text>

  <path d="M982 435H1040V305H1092" fill="none" stroke="#ffd447" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1090 285L1124 305L1090 325Z" fill="#ffd447"/>
  <path d="M1040 435V565H1092" fill="none" stroke="#ffd447" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1090 545L1124 565L1090 585Z" fill="#ffd447"/>

  <rect x="1140" y="215" width="380" height="180" rx="22" fill="#f4efe5"/>
  <rect x="1140" y="215" width="380" height="62" rx="22" fill="#2f7ef7"/>
  <text x="1330" y="256" fill="#fff" font-family="Space Grotesk, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">OBSERVABILITÉ · SRE</text>
  <text x="1330" y="322" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Exploitation de tous les jours</text>
  <text x="1330" y="354" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Niveau de détail réduit</text>

  <rect x="1140" y="475" width="380" height="180" rx="22" fill="#f4efe5"/>
  <rect x="1140" y="475" width="380" height="62" rx="22" fill="#e22b2b"/>
  <text x="1330" y="516" fill="#fff" font-family="Space Grotesk, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="middle">SÉCURITÉ · SOC</text>
  <text x="1330" y="582" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Attaques, compromissions,</text>
  <text x="1330" y="614" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">détournements · détail fin</text>

  <rect x="480" y="720" width="640" height="52" rx="8" fill="#ffd447"/>
  <text x="800" y="756" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">MÊME DONNÉE, DEUX NIVEAUX DE DÉTAIL</text>
  <text x="800" y="822" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="24" text-anchor="middle">Un SRE qui règle un incident n’a pas besoin du même détail qu’un expert SOC.</text>
</svg>
