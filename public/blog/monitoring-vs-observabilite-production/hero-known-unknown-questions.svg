<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Questions connues et questions imprévues en production</title><desc id="desc">Le monitoring répond aux questions préparées tandis que l'observabilité permet d'explorer une question imprévue à partir de signaux reliés.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/><path d="M800 170v610" stroke="#d9e2ec" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif"><text x="120" y="120" fill="#121821" font-size="52" font-weight="800">KNOWN QUESTION</text><text x="880" y="120" fill="#121821" font-size="52" font-weight="800">UNEXPECTED QUESTION</text>
    <g transform="translate(120 230)"><rect width="560" height="420" rx="8" fill="#fff" stroke="#d9e2ec" stroke-width="3"/><g fill="#059669"><circle cx="90" cy="90" r="24"/><circle cx="90" cy="200" r="24"/><circle cx="90" cy="310" r="24"/></g><g fill="#344054" font-size="28" font-weight="700"><text x="145" y="99">Threshold crossed?</text><text x="145" y="209">Service available?</text><text x="145" y="319">Latency above target?</text></g><path d="M400 82h90M400 192h90M400 302h90" stroke="#059669" stroke-width="12"/></g>
    <g transform="translate(880 230)"><rect width="600" height="420" rx="8" fill="#111827"/><g fill="none" stroke-width="7"><path d="M80 300C160 80 230 330 310 150S460 70 530 240" stroke="#3b82f6"/><path d="M90 110C180 330 250 90 350 270S470 330 540 120" stroke="#34d399"/><path d="M120 230h370" stroke="#f87171" stroke-dasharray="14 14"/></g><g fill="#fff"><circle cx="310" cy="150" r="12"/><circle cx="350" cy="270" r="12"/></g><circle cx="410" cy="205" r="58" fill="none" stroke="#fff" stroke-width="8"/><path d="M452 247l68 68" stroke="#fff" stroke-width="12"/></g>
    <text x="120" y="735" fill="#667085" font-size="25">Prepared checks detect a known symptom.</text><text x="880" y="735" fill="#667085" font-size="25">Correlated signals help explain what you did not predict.</text></g>
</svg>
