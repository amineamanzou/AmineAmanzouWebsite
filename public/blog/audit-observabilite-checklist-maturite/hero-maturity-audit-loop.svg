<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Boucle d'audit de maturité observabilité</title><desc id="desc">Sept domaines d'audit entourent une décision opérationnelle : expérience, instrumentation, pipeline, stockage, opérations, gouvernance et amélioration.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <g transform="translate(800 540)" font-family="Inter, Arial, sans-serif" text-anchor="middle"><circle r="150" fill="#111827"/><text y="-10" fill="#fff" font-size="34" font-weight="800">DECISION</text><text y="32" fill="#cbd5e1" font-size="24">or verification</text>
  <g font-size="24" font-weight="700"><g transform="translate(0 -310)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#2563eb" stroke-width="4"/><text y="9" fill="#121821">User experience</text></g><g transform="translate(255 -195)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#2563eb" stroke-width="4"/><text y="9" fill="#121821">Instrumentation</text></g><g transform="translate(320 70)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#059669" stroke-width="4"/><text y="9" fill="#121821">Pipelines</text></g><g transform="translate(150 290)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#059669" stroke-width="4"/><text y="9" fill="#121821">Storage &amp; cost</text></g><g transform="translate(-150 290)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="4"/><text y="9" fill="#121821">Operations</text></g><g transform="translate(-320 70)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#b42318" stroke-width="4"/><text y="9" fill="#121821">Governance</text></g><g transform="translate(-255 -195)"><rect x="-130" y="-52" width="260" height="104" rx="8" fill="#fff" stroke="#b42318" stroke-width="4"/><text y="9" fill="#121821">Improvement</text></g></g>
  <g stroke="#b8c7d8" stroke-width="4"><path d="M0-150V-258"/><path d="M105-108l110-55"/><path d="M145 38l123 27"/><path d="M88 122l42 116"/><path d="M-88 122l-42 116"/><path d="M-145 38l-123 27"/><path d="M-105-108l-110-55"/></g></g>
  <text x="95" y="110" fill="#121821" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">MATURITY IS A DECISION SYSTEM</text><text x="98" y="162" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="26">A checklist matters only when each check changes a decision or verifies a risk.</text>
</svg>
