<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Déroulement de la panne Cloudflare du 18 novembre 2025</title>
  <desc id="desc">Six jalons horaires, de 11 h 05 à 17 h 06 UTC : changement de permissions, premières erreurs, fausse piste d’une attaque DDoS, correctif, puis reprise.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="26" fill="#111"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#grid)" stroke="#f4efe5" stroke-width="4"/>
  <rect x="72" y="64" width="690" height="48" rx="8" fill="#ffd447"/>
  <text x="96" y="98" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="29" font-weight="800">LA PANNE CLOUDFLARE, HEURE PAR HEURE</text>
  <text x="72" y="158" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="25">18 novembre 2025, heures UTC. D’après le compte rendu publié par Cloudflare.</text>
  <rect x="416" y="250" width="508" height="150" rx="16" fill="#e22b2b"/>
  <text x="440" y="292" fill="#fff" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="23" font-weight="800">FAUSSE PISTE : UNE ATTAQUE DDoS ?</text>
  <text x="440" y="324" fill="#fff" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600">Le réseau tombe, repart, retombe.</text>
  <polyline points="440,372 469,346 498,378 527,350 556,380 585,344 614,376 643,352 672,380 701,348 730,374 759,346 788,380 817,350 846,378 875,344 904,376" fill="none" stroke="#111" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="936" y="250" width="248" height="150" rx="16" fill="#ffd447"/>
  <text x="960" y="292" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="23" font-weight="800">CORRECTIF</text>
  <text x="960" y="330" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600">Retour à un</text>
  <text x="960" y="358" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600">fichier sain</text>
  <rect x="1196" y="250" width="248" height="150" rx="16" fill="#f4efe5"/>
  <text x="1220" y="292" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="23" font-weight="800">REPRISE</text>
  <text x="1220" y="330" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600">Le trafic revient</text>
  <text x="1220" y="358" fill="#111" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="600">d’un coup</text>
  <text x="280" y="436" fill="#b9b3a6" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">15 min</text>
  <text x="670" y="436" fill="#b9b3a6" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">≈ 2 h 15</text>
  <text x="1060" y="436" fill="#b9b3a6" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">≈ 55 min</text>
  <text x="1320" y="436" fill="#b9b3a6" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">≈ 2 h 35</text>
  <path d="M110 470H1490" stroke="#f4efe5" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="470" r="17" fill="#f4efe5" stroke="#111" stroke-width="5"/>
  <text x="150" y="528" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">11:05</text>
  <text x="150" y="564" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Changement de</text>
  <text x="150" y="591" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">permissions en base</text>
  <circle cx="410" cy="470" r="17" fill="#e22b2b" stroke="#111" stroke-width="5"/>
  <text x="410" y="528" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">11:20</text>
  <text x="410" y="564" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Premières erreurs</text>
  <text x="410" y="591" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">côté clients</text>
  <circle cx="670" cy="470" r="17" fill="#e22b2b" stroke="#111" stroke-width="5"/>
  <text x="670" y="528" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">13:05</text>
  <text x="670" y="564" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Contournement partiel,</text>
  <text x="670" y="591" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">l’impact baisse</text>
  <circle cx="930" cy="470" r="17" fill="#ffd447" stroke="#111" stroke-width="5"/>
  <text x="930" y="528" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">13:37</text>
  <text x="930" y="564" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Le fichier fautif</text>
  <text x="930" y="591" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">est identifié</text>
  <circle cx="1190" cy="470" r="17" fill="#ffd447" stroke="#111" stroke-width="5"/>
  <text x="1190" y="528" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">14:30</text>
  <text x="1190" y="564" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Trafic rétabli</text>
  <text x="1190" y="591" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">pour l’essentiel</text>
  <circle cx="1450" cy="470" r="17" fill="#2faa67" stroke="#111" stroke-width="5"/>
  <text x="1450" y="528" fill="#ffd447" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">17:06</text>
  <text x="1450" y="564" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Retour complet</text>
  <text x="1450" y="591" fill="#f4efe5" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">à la normale</text>
  <path d="M410 640V668H1190V640" fill="none" stroke="#ffd447" stroke-width="5" stroke-linejoin="round"/>
  <rect x="590" y="690" width="420" height="50" rx="8" fill="#ffd447"/>
  <text x="800" y="725" fill="#111" font-family="Space Grotesk, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="middle">LA ZONE DU SURINCIDENT</text>
  <text x="800" y="790" fill="#f4efe5" font-family="Epilogue, Arial, sans-serif" font-size="23" text-anchor="middle">Côté client, c’est là qu’on est tenté de redémarrer ou d’annuler un déploiement.</text>
</svg>
