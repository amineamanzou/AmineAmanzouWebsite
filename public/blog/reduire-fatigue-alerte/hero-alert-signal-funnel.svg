<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Entonnoir de qualité des alertes</title><desc id="desc">Un flux de notifications bruyantes est filtré par l'impact, l'urgence et l'actionnabilité avant d'atteindre l'astreinte, tandis qu'une boucle vérifie les incidents manqués.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563eb"/></marker></defs><rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="95" y="115" fill="#121821" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">PRESERVE HUMAN RESPONSE CAPACITY</text><text x="98" y="166" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="26">Fewer pages is useful only when important incidents remain discoverable.</text>
  <g transform="translate(110 270)"><g fill="#fff" stroke="#d9e2ec" stroke-width="3"><rect width="340" height="100" rx="8"/><rect y="125" width="340" height="100" rx="8"/><rect y="250" width="340" height="100" rx="8"/><rect y="375" width="340" height="100" rx="8"/></g><g fill="#b42318"><circle cx="58" cy="50" r="24"/><circle cx="58" cy="175" r="24"/><circle cx="58" cy="300" r="24"/><circle cx="58" cy="425" r="24"/></g><g fill="#344054" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><text x="105" y="59">Duplicate</text><text x="105" y="184">No action</text><text x="105" y="309">No user impact</text><text x="105" y="434">Imminent risk</text></g></g>
  <g transform="translate(580 250)" font-family="Inter, Arial, sans-serif" text-anchor="middle"><path d="M0 0h440l-130 470H130z" fill="#fff" stroke="#2563eb" stroke-width="5"/><g fill="#121821" font-size="28" font-weight="700"><text x="220" y="105">IMPACT</text><text x="220" y="225">URGENCY</text><text x="220" y="345">ACTIONABILITY</text></g><path d="M78 145h284M108 265h224" stroke="#d9e2ec" stroke-width="3"/></g>
  <g transform="translate(1160 340)" font-family="Inter, Arial, sans-serif" text-anchor="middle"><rect width="320" height="210" rx="8" fill="#111827"/><path d="M160 48c-42 0-70 33-70 76v22l-25 24h190l-25-24v-22c0-43-28-76-70-76z" fill="none" stroke="#34d399" stroke-width="9"/><text x="160" y="190" fill="#fff" font-size="26" font-weight="700">Actionable page</text></g>
  <g fill="none" stroke="#2563eb" stroke-width="8" marker-end="url(#a)"><path d="M450 510h115"/><path d="M1020 485h125"/></g>
  <path d="M1320 585C1320 760 450 790 310 645" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#a)"/><text x="760" y="800" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle">Review incidents discovered outside paging</text>
</svg>
